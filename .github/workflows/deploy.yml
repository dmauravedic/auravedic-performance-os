name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild every morning (06:30 IST, after the 04:51 IST data pulls) so the site picks up the
  # latest rows from the Google Sheet. Until the sheet is configured this just rebuilds the snapshot.
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pulls the sheet into src/data before the build. With no secret / variable set it prints a
      # notice and keeps the bundled snapshot; with bad sheet data it fails the run, so the last
      # good site stays live instead of publishing broken numbers.
      - name: Sync data from the Google Sheet
        # The sheet ids are secrets, not variables: a variable's value is printed in the workflow
        # log, and the log of a public repository is public.
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          SHAN_SHEET_ID: ${{ secrets.SHAN_SHEET_ID }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ] && { [ -n "$GOOGLE_SHEET_ID" ] || [ -n "$SHAN_SHEET_ID" ]; }; then
            pip install gspread google-auth
          fi
          python scripts/sync_from_sheet.py
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
